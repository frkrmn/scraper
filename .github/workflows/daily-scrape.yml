name: Daily KMQuant Scrape

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kmquant-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run KMquant scraper
        run: npm run scrape:kmquant
        env:
          KMQUANT_EMAIL: ${{ secrets.KMQUANT_EMAIL }}
          KMQUANT_PASSWORD: ${{ secrets.KMQUANT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/api/latest.json
          git diff --staged --quiet || git commit -m "Daily data update"
          git push
